[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcds"
version = "0.1.0"
description = "Market catchment demand/supply analysis for SMB acquisition screening"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# The reasoning stages. The scoring path deliberately has no LLM dependency.
reasoning = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "jsonschema>=4.18"]

[project.scripts]
mcds = "mcds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
