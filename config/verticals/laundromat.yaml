# Vertical config: Laundromat / Coin Laundry
id: laundromat
label: Laundromat / Coin Laundry
version: 1

catchment:
  # Laundry is a haul trip with a wait. Real-world catchments are tight — people
  # go to the closest acceptable option, and 10 minutes each way twice per visit
  # is already a lot for a chore.
  default_minutes: 10
  alternates: [6, 15]
  profile: driving

places:
  # `dry_cleaner` is NOT a filterable Google place type -- the live API rejects
  # it outright. Google files dry cleaners under `laundry` alongside
  # self-service laundromats, which makes the classifier's job harder, not
  # easier: the two businesses arrive in one undifferentiated bucket and have to
  # be told apart from name, hours, and price level.
  #
  # Google's type filter is also hierarchical: filtering on a parent type
  # already returns its subtypes. Listing both a parent and its child is
  # redundant rather than additive.
  #
  # Verify any change here with:  python scripts/probe.py --validate-types --vertical laundromat
  direct_types:   [laundry]
  adjacent_types: []
  context_types:  [convenience_store, storage]

substitution:
  priors:
    laundry: direct
    convenience_store: none
    storage: none
  guidance: >
    Google's `laundry` type is far wider than it sounds, and this is the whole
    difficulty of the vertical. A real 10-minute Denver catchment returned 33
    places typed `laundry`, of which roughly 9 were actual self-service
    laundromats. The rest were drop-off dry cleaners, carpet cleaners,
    janitorial and commercial facility firms, house-cleaning crews, and one
    appliance retailer.

    So the first question on every record is not how strongly it competes but
    whether it is a laundromat at all. Read the name first: carpet, janitorial,
    facility, restoration, upholstery, duct, maid, crew, and appliance all
    indicate a business with no coin-laundry customers whatsoever -- score those
    `none`. Names containing cleaners, dry clean, martinizing, alterations, or
    tailor without any laundry word indicate a drop-off dry cleaner, which is
    `adjacent` at most. Laundromat, coin laundry, wash, and washateria indicate
    the real thing.

    Watch for the trap that entrenchment sets here. In that Denver catchment the
    single most-reviewed business, at 581 reviews, was a commercial cleaning
    company -- it would rank as the strongest competitor in the market while
    competing for nothing. High review counts on non-competitors are common in
    this bucket, because commercial services accumulate reviews faster than
    coin laundries do.

    Price level is effectively unavailable: it was missing on 32 of 33 records.
    Do not rely on it to separate formats in this vertical.

    Among the genuine laundromats, 24-hour operation, card versus coin, and
    attended wash-dry-fold service are the distinctions that matter. Wash-and-fold
    offered by a laundromat competes with dry cleaners, not the reverse.

demand:
  # The demand driver here is renter-occupied housing without in-unit laundry,
  # not income. This is the clearest case in the seed set where the naive
  # "higher income = better market" instinct is backwards.
  filters:
    - dimension: tenure
      source_table: B25003     # Tenure
      unit: household
      include_bands: [renter_occupied]
      rationale: >
        Renter households are the core market; owner-occupied units usually have
        in-unit laundry. Used as a weight on total households, not a hard filter.
    - dimension: household_income
      source_table: B19001
      unit: household
      min: null
      max: 75000
      rationale: >
        Demand is inversely income-gated: above roughly this level households
        tend to have or buy in-unit machines. The ceiling is the filter that
        matters; there is deliberately no floor.
  combination: multiplicative
  independence_penalty: true

benchmark:
  method: cbp_derived
  households_per_location: null
  naics: "812310"              # Coin-Operated Laundries and Drycleaners
  source: null
  source_url: null
  vintage: null
  confidence: none
  notes: >
    Coin Laundry Association publishes industry ratios that would serve as a
    static cross-check on the CBP-derived figure. Fill in `source` and
    `source_url` if you substitute a static value.
