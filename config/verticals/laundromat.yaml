# Vertical config: Laundromat / Coin Laundry
id: laundromat
label: Laundromat / Coin Laundry
version: 1

catchment:
  # Laundry is a haul trip with a wait. Real-world catchments are tight — people
  # go to the closest acceptable option, and 10 minutes each way twice per visit
  # is already a lot for a chore.
  default_minutes: 10
  alternates: [6, 15]
  profile: driving

places:
  # `dry_cleaner` is NOT a filterable Google place type -- the live API rejects
  # it outright. Google files dry cleaners under `laundry` alongside
  # self-service laundromats, which makes the classifier's job harder, not
  # easier: the two businesses arrive in one undifferentiated bucket and have to
  # be told apart from name, hours, and price level.
  #
  # Google's type filter is also hierarchical: filtering on a parent type
  # already returns its subtypes. Listing both a parent and its child is
  # redundant rather than additive.
  #
  # Verify any change here with:  python scripts/probe.py --validate-types --vertical laundromat
  direct_types:   [laundry]
  adjacent_types: []
  context_types:  [convenience_store, storage]

substitution:
  priors:
    laundry: direct
    convenience_store: none
    storage: none
  guidance: >
    Google has no separate dry-cleaner type, so `laundry` arrives as one bucket
    holding both self-service laundromats and drop-off dry cleaners -- different
    businesses serving different customers. Separating them is the single most
    valuable judgment you make on this vertical, and it has to come from the
    name, hours, and price level: 24-hour operation and no "cleaners" or
    "dry clean" in the name strongly suggest self-service. Score a dry cleaner
    `adjacent` at most for a coin-laundry customer.

    This is also why the priors-only path (--no-llm) is weak here specifically:
    it scores every `laundry` as a direct competitor, dry cleaners included, and
    so overstates supply. Say so when it applies.

    Wash-and-fold offered by a laundromat competes with dry cleaners, not the
    reverse. Card-operated modern stores compete differently from coin-only
    legacy ones.

clustering:
  # DBSCAN radius for detecting competitor corridors. Density-sensitive: too
  # wide and every competitor lands in one cluster, which says nothing.
  # Dense urban laundromat markets sit a few blocks apart; 0.8 km merges the whole catchment into one blob.
  eps_km: 0.4
  min_samples: 3

demand:
  # The demand driver here is renter-occupied housing without in-unit laundry,
  # not income. This is the clearest case in the seed set where the naive
  # "higher income = better market" instinct is backwards.
  filters:
    - dimension: tenure
      source_table: B25003     # Tenure
      unit: household
      include_bands: [renter_occupied]
      rationale: >
        Renter households are the core market; owner-occupied units usually have
        in-unit laundry. Used as a weight on total households, not a hard filter.
    - dimension: household_income
      source_table: B19001
      unit: household
      min: null
      max: 75000
      rationale: >
        Demand is inversely income-gated: above roughly this level households
        tend to have or buy in-unit machines. The ceiling is the filter that
        matters; there is deliberately no floor.
  combination: multiplicative
  independence_penalty: true

benchmark:
  method: cbp_derived
  households_per_location: null
  naics: "812310"              # Coin-Operated Laundries and Drycleaners
  source: null
  source_url: null
  vintage: null
  confidence: none
  notes: >
    Coin Laundry Association publishes industry ratios that would serve as a
    static cross-check on the CBP-derived figure. Fill in `source` and
    `source_url` if you substitute a static value.
